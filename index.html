<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Coockie</title>
    <script src="Build/UnityLoader.js"></script>
    <script>
      UnityLoader.instantiate("unityContainer", "Build/cooc.json");
    </script>
        <style>
      /* Сброс отступов */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden; /* Убираем скролл */
        background: #000; /* Черный фон на случай если игра не заполнит весь экран */
        touch-action: manipulation; /* Улучшает работу на сенсорных экранах */
      }
      
      /* Основной контейнер для WebGL */
      .webgl-content {
        width: 100%;
        height: 100vh;
        min-height: -webkit-fill-available; /* Для iOS */
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000;
      }
      
      /* Контейнер Unity */
      #unityContainer {
        width: 100%;
        height: 100%;
        position: relative;
        background: #000;
      }
      
      /* Контейнер для canvas Unity */
      #unityContainer canvas {
        width: 100% !important;
        height: 100% !important;
        object-fit: contain; /* Сохраняет пропорции игры */
        background: #000;
      }
      
      /* Для ландшафтной ориентации на мобильных */
      @media (orientation: landscape) and (max-height: 600px) {
        #unityContainer canvas {
          object-fit: cover; /* Заполняет экран в ландшафте */
        }
      }
      
      /* Для десктопов и больших экранов */
      @media (min-width: 1024px) {
        .webgl-content {
          max-width: 100%;
          max-height: 100vh;
        }
        
        #unityContainer {
          max-width: 100%;
          max-height: 100vh;
        }
      }
      
      /* Для планшетов */
      @media (min-width: 768px) and (max-width: 1023px) {
        .webgl-content {
          height: calc(100vh - 20px);
          padding: 10px 0;
        }
      }
      
      /* Для мобильных устройств */
      @media (max-width: 767px) {
        body {
          position: fixed; /* Фиксируем для iOS */
          width: 100%;
          height: 100%;
        }
        
        .webgl-content {
          height: 100vh;
          height: -webkit-fill-available;
          height: fill-available;
        }
        
        /* Скрываем элементы управления по умолчанию на мобильных */
        #unityContainer + div {
          font-size: 12px !important;
        }
      }
      
      /* Для очень маленьких экранов */
      @media (max-width: 320px) {
        .webgl-content {
          height: 100vh;
        }
      }
      
      /* Загрузочный экран (если используется) */
      .loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        z-index: 1000;
      }
      
      /* Оверлей для сообщений на мобильных */
      .mobile-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.9);
        color: white;
        z-index: 9999;
        text-align: center;
        padding: 20px;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
      }
      
      .mobile-overlay.active {
        display: flex;
      }
      
      .mobile-overlay h2 {
        margin-bottom: 20px;
        font-size: 24px;
      }
      
      .mobile-overlay p {
        margin-bottom: 15px;
        font-size: 16px;
        line-height: 1.5;
      }
      
      .rotate-icon {
        font-size: 48px;
        margin: 20px 0;
        animation: rotate 2s infinite;
      }
      
      @keyframes rotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(90deg); }
      }
      
      /* Для устройств с вырезом (notch) */
      @supports (padding: max(0px)) {
        .webgl-content {
          padding-left: max(0px, env(safe-area-inset-left));
          padding-right: max(0px, env(safe-area-inset-right));
          padding-top: max(0px, env(safe-area-inset-top));
          padding-bottom: max(0px, env(safe-area-inset-bottom));
        }
      }
    </style>
  </head>
  <body>
    <div id="unityContainer" ></div>
  </body>
</html>
