<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="HandheldFriendly" content="true">
    <meta name="MobileOptimized" content="width">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>Unity WebGL Player | Coockie</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    
    <!-- Адаптивные стили -->
    <style>
      /* Сброс отступов */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden; /* Убираем скролл */
        background: #000; /* Черный фон на случай если игра не заполнит весь экран */
        touch-action: manipulation; /* Улучшает работу на сенсорных экранах */
      }
      
      /* Основной контейнер для WebGL */
      .webgl-content {
        width: 100%;
        height: 100vh;
        min-height: -webkit-fill-available; /* Для iOS */
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000;
      }
      
      /* Контейнер Unity */
      #unityContainer {
        width: 100%;
        height: 100%;
        position: relative;
        background: #000;
      }
      
      /* Контейнер для canvas Unity */
      #unityContainer canvas {
        width: 100% !important;
        height: 100% !important;
        object-fit: contain; /* Сохраняет пропорции игры */
        background: #000;
      }
      
      /* Для ландшафтной ориентации на мобильных */
      @media (orientation: landscape) and (max-height: 600px) {
        #unityContainer canvas {
          object-fit: cover; /* Заполняет экран в ландшафте */
        }
      }
      
      /* Для десктопов и больших экранов */
      @media (min-width: 1024px) {
        .webgl-content {
          max-width: 100%;
          max-height: 100vh;
        }
        
        #unityContainer {
          max-width: 100%;
          max-height: 100vh;
        }
      }
      
      /* Для планшетов */
      @media (min-width: 768px) and (max-width: 1023px) {
        .webgl-content {
          height: calc(100vh - 20px);
          padding: 10px 0;
        }
      }
      
      /* Для мобильных устройств */
      @media (max-width: 767px) {
        body {
          position: fixed; /* Фиксируем для iOS */
          width: 100%;
          height: 100%;
        }
        
        .webgl-content {
          height: 100vh;
          height: -webkit-fill-available;
          height: fill-available;
        }
        
        /* Скрываем элементы управления по умолчанию на мобильных */
        #unityContainer + div {
          font-size: 12px !important;
        }
      }
      
      /* Для очень маленьких экранов */
      @media (max-width: 320px) {
        .webgl-content {
          height: 100vh;
        }
      }
      
      /* Загрузочный экран (если используется) */
      .loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        z-index: 1000;
      }
      
      /* Оверлей для сообщений на мобильных */
      .mobile-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.9);
        color: white;
        z-index: 9999;
        text-align: center;
        padding: 20px;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
      }
      
      .mobile-overlay.active {
        display: flex;
      }
      
      .mobile-overlay h2 {
        margin-bottom: 20px;
        font-size: 24px;
      }
      
      .mobile-overlay p {
        margin-bottom: 15px;
        font-size: 16px;
        line-height: 1.5;
      }
      
      .rotate-icon {
        font-size: 48px;
        margin: 20px 0;
        animation: rotate 2s infinite;
      }
      
      @keyframes rotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(90deg); }
      }
      
      /* Для устройств с вырезом (notch) */
      @supports (padding: max(0px)) {
        .webgl-content {
          padding-left: max(0px, env(safe-area-inset-left));
          padding-right: max(0px, env(safe-area-inset-right));
          padding-top: max(0px, env(safe-area-inset-top));
          padding-bottom: max(0px, env(safe-area-inset-bottom));
        }
      }
    </style>
    
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
  </head>
  
  <body>

    <div class="webgl-content">
      <div id="unityContainer"></div>
      <!-- Прогресс загрузки будет добавлен Unity -->
    </div>
    
    <script>
      // Адаптивная инициализация Unity
      function initializeUnity() {
        // Определяем параметры для разных устройств
        var config = {
          onProgress: UnityProgress,
          Module: {
            // Оптимизация для мобильных
            onRuntimeInitialized: function() {
              console.log("Unity runtime initialized");
              // Скрываем мобильный оверлей после загрузки
              hideMobileOverlay();
            }
          }
        };
        
        // Добавляем параметры для мобильных устройств
        if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
          config.devicePixelRatio = window.devicePixelRatio || 1;
          console.log("Mobile device detected, devicePixelRatio:", config.devicePixelRatio);
        }
        
        // Запускаем Unity
        var unityInstance = UnityLoader.instantiate("unityContainer", "Build/GameCenter.json", config);
        
        // Обработка изменения размера окна
        window.addEventListener('resize', function() {
          handleResize();
        });
        
        // Обработка ориентации устройства
        window.addEventListener('orientationchange', function() {
          setTimeout(handleResize, 100);
          checkOrientation();
        });
        
        // Проверяем ориентацию при загрузке
        setTimeout(checkOrientation, 500);
        setTimeout(handleResize, 100);
        
        return unityInstance;
      }
      
      // Обработчик изменения размера
      function handleResize() {
        var container = document.getElementById('unityContainer');
        if (container && container.children.length > 0) {
          var canvas = container.querySelector('canvas');
          if (canvas) {
            // Обновляем размер canvas
            canvas.style.width = '100%';
            canvas.style.height = '100%';
          }
        }
      }
      
      // Проверка ориентации устройства
      function checkOrientation() {
        var overlay = document.getElementById('mobileOverlay');
        if (!overlay) return;
        
        // Показываем оверлей только на мобильных в портретной ориентации
        if (window.innerHeight > window.innerWidth && /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
          overlay.classList.add('active');
        } else {
          overlay.classList.remove('active');
        }
      }
      
      // Скрытие мобильного оверлея
      function hideMobileOverlay() {
        var overlay = document.getElementById('mobileOverlay');
        if (overlay) {
          overlay.classList.remove('active');
        }
      }
      
      // Предотвращаем масштабирование на мобильных (опционально)
      document.addEventListener('touchmove', function(e) {
        if(e.scale !== 1) {
          e.preventDefault();
        }
      }, { passive: false });
      
      document.addEventListener('gesturestart', function(e) {
        e.preventDefault();
      });
      
      // Запускаем Unity после загрузки страницы
      window.addEventListener('load', function() {
        setTimeout(initializeUnity, 100);
      });
      
      // Для iOS - предотвращаем bounce эффект
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });
      
      document.addEventListener('touchend', function(e) {
        if (e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });
      
    </script>
    
    <!-- Запасной скрипт, если основной не сработал -->
   
  </body>
</html>
